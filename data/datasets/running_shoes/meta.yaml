# Dataset descriptor. Everything category-specific lives here so that no
# module in backend/nucleus/ hardcodes "running shoes" or a spec field name.
# To test another category: copy this directory, rewrite this file and the
# products/, then point config.dataset at it.

category: running_shoes
display_name: Running Shoes

# Fed to persona spawning. Deliberately just the category -- personas must be
# generated from the seed and the category name ONLY, never from product data,
# or they will only ask about what the catalogue already covers.
category_phrase: running shoes

currency: "$"

# Material Symbols name used as the product placeholder in the storefront.
icon: footprint

spec_labels:
  weight_g: Weight
  drop_mm: Heel-to-toe drop
  stack_height_mm: Stack height
  upper: Upper material
  midsole: Midsole foam
  outsole: Outsole
  plate: Plate
  surface: Surface
  waterproof: Waterproof
  cushioning: Cushioning level

# ---------------------------------------------------------------------------
# Claim traceability rules.
#
# The dormant agent may only assert something about a product if one of these
# rules licenses it from an actual spec value. Enforced in code by
# agents/adapter.py -- NOT merely requested in the prompt. Any sentence whose
# terms are not licensed downgrades the whole proposal to `flag`.
#
#   spec            the spec field that must be present on the product
#   when            a condition on that field's value
#   licenses        claim terms this rule permits in the new description
# ---------------------------------------------------------------------------
claim_rules:
  - spec: upper
    when: {matches: "mesh|knit"}
    licenses: [breathable, breathability, breathe, airflow, ventilated, ventilation, airy, cool, cooling]

  - spec: upper
    when: {matches: "ripstop|tpu|synthetic overlay"}
    licenses: [durable, abrasion, protective, rugged, hard-wearing]

  - spec: weight_g
    when: {below: 230}
    licenses: [light, lightweight, featherweight, nimble, barely-there, low-slung]

  - spec: weight_g
    when: {at_or_above: 300}
    licenses: [substantial, sturdy, structured]

  - spec: stack_height_mm
    when: {at_or_above: 34}
    licenses: [cushioned, cushioning, plush, soft, forgiving, high-stack, long-run, long-distance, marathon]

  - spec: stack_height_mm
    when: {below: 22}
    licenses: [ground-feel, low-profile, minimal, close-to-the-ground, natural]

  - spec: drop_mm
    when: {at_or_below: 4}
    licenses: [low-drop, natural, midfoot, forefoot, level]

  - spec: drop_mm
    when: {at_or_above: 10}
    licenses: [heel-strike, achilles, high-drop, heel-cushioned]

  - spec: plate
    when: {matches: "carbon"}
    licenses: [fast, race, racing, propulsive, responsive, snappy, speed, tempo, pb, energy-return]

  - spec: outsole
    when: {matches: "lug|aggressive"}
    licenses: [grip, grippy, traction, trail, off-road, mud, loose, technical]

  - spec: outsole
    when: {matches: "carbon rubber|blown rubber"}
    licenses: [durable, hard-wearing, high-mileage, long-lasting]

  - spec: waterproof
    when: {equals: true}
    licenses: [waterproof, wet, rain, dry, weatherproof, puddle]

  - spec: surface
    when: {matches: "trail"}
    licenses: [trail, off-road, technical, trails]

  - spec: surface
    when: {matches: "road"}
    licenses: [road, pavement, tarmac, street]

  - spec: cushioning
    when: {matches: "max|high"}
    licenses: [cushioned, plush, soft, forgiving, recovery, easy-day]

  - spec: cushioning
    when: {matches: "firm|low"}
    licenses: [firm, responsive, connected, snappy]

  - spec: midsole
    when: {matches: "pebax|supercritical"}
    licenses: [responsive, energy-return, bouncy, springy, resilient]

# Numeric claims (e.g. "under 200g", "8mm drop") must reconcile against one of
# these fields or the sentence fails traceability automatically.
numeric_fields: [weight_g, drop_mm, stack_height_mm, price]

# Attributes shoppers genuinely ask about that this catalogue records NO spec
# for. Documented so the flag path is deliberate and inspectable rather than
# accidental: the adapter cannot support any of these and must refuse them.
#
# Enforcement does NOT live here -- it lives in claim_rules above, which simply
# never license these terms, so a sentence claiming one fails traceability and
# downgrades the whole proposal to `flag`. This list is what the report's gap
# classifier is told about the dataset, and it is honest: every entry is a real
# absence, not a trap. The breadth matters because the refusal path only fires
# when a shopper asks about something unrecorded -- a narrow list means a
# persona can easily miss it entirely.
unsupported_attributes:
  - toe box width
  - available widths or wide sizes
  - arch support
  - pronation or stability control
  - sizing accuracy or true-to-size fit
  - reflectivity or visibility for night running
  - orthotic compatibility or removable insole
  - recycled or sustainable materials
  - vegan or animal-free materials
  - break-in period
  - heel slippage or heel lock
  - suitability for heavier runners
  - warranty or guaranteed mileage
  - noise or quietness underfoot

# ---------------------------------------------------------------------------
# Discrimination gate (`python -m nucleus.probe`). Hand-written per dataset;
# they name product ids, so they live here rather than in code.
#   expect  products whose copy already states the thing. AT LEAST ONE must
#           surface -- not all. Several compete for the same k slots and which
#           wins a tie is not a property worth asserting.
#   blind   products whose specs support the claim but whose copy is silent.
#           These should NOT surface: they are the gap the adapter closes.
# ---------------------------------------------------------------------------
probes:
  - query: lightweight breathable shoe for hot humid weather
    expect: [sku_001, sku_022]
    blind: [sku_002, sku_011, sku_012, sku_014]

  - query: highly cushioned shoe for long slow marathon training runs
    expect: [sku_004]
    blind: [sku_005, sku_015, sku_021]

  - query: waterproof shoe for running in heavy rain and puddles
    expect: [sku_007]
    blind: [sku_009]

  - query: fast carbon plated racing shoe for a personal best
    expect: [sku_010]
    blind: [sku_006]

  # Both sku_007 and sku_013 state grip and compete for the same pinned k=5
  # slots; the intent is served if EITHER surfaces.
  - query: grippy shoe for muddy technical trails
    expect: [sku_007, sku_013]
    blind: [sku_008]

# ---------------------------------------------------------------------------
# The refusal surface, exercised by tests/test_unsupported.py.
#
# `unsupported_claims` are the sentences a shopper would actually use for the
# attributes listed above. NOT ONE of them may be licensable by ANY product in
# this catalogue under ANY citation. If one ever becomes writable, either a
# spec was added (update unsupported_attributes) or a claim rule is too loose.
#
# `supported_claim_example` keeps the refusal specific rather than blanket: a
# real product making a real claim off a real spec field must still pass.
# ---------------------------------------------------------------------------
unsupported_claims:
  - It has a generously wide toe box with room to splay.
  - Available in wide sizes for broader feet.
  - Excellent arch support for high arches.
  - Controls overpronation with a stable platform.
  - Fits true to size, so order your usual.
  - Reflective panels keep you visible on night runs.
  - The removable insole takes a custom orthotic.
  - Made from recycled materials with a low carbon footprint.
  - Fully vegan with no animal-derived materials.
  - No break-in period needed, comfortable from the first run.
  - A locked-in heel that never slips.
  - Built to take the load for heavier runners.
  - Backed by a 500-mile durability guarantee.
  - Runs quietly and lands almost silently.

supported_claim_example:
  product: sku_014                 # engineered mesh, silent copy
  sentence: The engineered mesh upper is breathable.
  spec_fields: [upper]
